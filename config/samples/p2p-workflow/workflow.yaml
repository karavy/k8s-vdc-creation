# Runs the p2p-free-subnet template for one client. A Workflow is immutable and runs once: to run
# it again, create a new one with another name. Deleting it runs the delete steps of the
# templates, from the last to the first.
apiVersion: kmetal.dinova.one/v1alpha1
kind: Workflow
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-free-subnet
spec:
  # Templates run in order and the first one that fails stops the Workflow. Add more entries to
  # run other templates after this one.
  templates:
    - name: free-subnet
      templateRef:
        name: p2p-free-subnet
      # Values for the template's parameters; the ones with a default can be left out.
      parameters:
        - {name: blockName, value: BLK-AUTOMAZIONE-P2P}
        - {name: envName, value: vcloud-r1.dinova.cloud}
        - {name: clientName, value: EXMACHINA}
        - {name: segmentSuffix, value: -NET}
        # No default: the name of the vCloud organization, as the orgs of the environment list it.
        - {name: vcloudOrgName, value: testav17}
        # Serial of the FortiFlex program, as the programs of the portal list it.
        - {name: flexvmSerial, value: ELAVMR0000000657}
        # Name of the FortiFlex configuration, exactly as the configs of the program list it.
        #    firewallBundle can be:
        #      - Istanza FortiGate SMALL - Funzionalità Base
        #      - Istanza FortiGate SMALL - Funzionalità UTP Bundle
        #      - Istanza FortiGate SMALL - Funzionalità Base - 3VDOM
        #      - Istanza FortiGate SMALL - Funzionalità Base + ATP
        #      - Istanza FortiGate MEDIUM - Funzionalità Base
        #      - Istanza FortiGate MEDIUM - Funzionalità UTP Bundle
        #      - Istanza FortiGate MEDIUM - Funzionalità UTP Bundle 3 VDOM
        #      - Istanza FortiGate SHARED01
        #      - Istanza FortiGate SHARED02
        - {name: firewallBundle, value: "Istanza FortiGate SMALL - Funzionalità UTP Bundle"}
        # Name of the virtual machine to deliver, and the contract it is recorded under.
        - {name: vmName, value: fw-exmachina-01}
        - {name: rifContratto, value: CNT.26.0001.01}
