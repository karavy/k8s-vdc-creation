                    - name
                    type: object
                  scopes:
                    description: Scopes requested from the OAuth authorization server.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  tokenSecretRef:
                    description: APISecretKeyReference selects a key from a same-namespace
                      Secret.
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tokenURL:
                    description: TokenURL is the OAuth 2.0 token endpoint. Its HTTPS
                      origin must be allowlisted.
                    maxLength: 2048
                    pattern: ^https://[^\s]+$
                    type: string
                  type:
                    enum:
                    - Bearer
                    - Basic
                    - APIKey
                    - OAuth2ClientCredentials
                    type: string
                  usernameSecretRef:
                    description: APISecretKeyReference selects a key from a same-namespace
                      Secret.
                    properties:
                      key:
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
