apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-fortigate-deliver
spec:
  method: POST
  # {env_id} is replaced by the workflow (input toPath) with the id found by get-env.
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/fortigate-vm/vcloud/{env_id}/deliver
  # Debug on the template and on the step that uses it: the operator only logs the request.
  debug: true
  timeoutSeconds: 120
  headers:
    Content-Type: application/json
    Accept: application/json
  # The workflow fills the empty strings. CHANGEME marks a value no step publishes yet (template_id, vdc_name); the rest
  # is fixed: create_vdc, the VDC sizes, and the netmask of a /31.
  body: '{"vm_name":"","template_id":"CHANGEME","org_name":"","org_id":"","vdc_name":"CHANGEME","create_vdc":true,"nsx_segment_id":"","nsx_segment_name":"","nsx_segment_network":"","assigned_ip":"","netmask":"255.255.255.254","gateway":"","flexvm_config_id":"","cliente":"","rif_contratto":"","vdc_cpu_mhz":4000,"vdc_ram_mb":8192,"vdc_storage_mb":61440}'
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-flexvm-configs
spec:
  method: GET
  # program_id is added by the workflow (input toQuery) from the program found by get-flexvm-programs.
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/fortigate-vm/flexvm/configs
  timeoutSeconds: 120
  headers:
    Accept: application/json
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-fortigate-job
spec:
  method: GET
  # {job_id} is replaced by the workflow (input toPath) with the id the deliver step published.
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/fortigate-vm/jobs/{job_id}
  timeoutSeconds: 120
  headers:
    Accept: application/json
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
