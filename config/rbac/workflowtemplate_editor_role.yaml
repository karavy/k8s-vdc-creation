# This rule is not used by the project k8s-vdc-creation itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kmetal.dinova.one.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/managed-by: kustomize
  name: workflowtemplate-editor-role
rules:
- apiGroups:
  - kmetal.dinova.one
  resources:
  - workflowtemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kmetal.dinova.one
  resources:
  - workflowtemplates/status
  verbs:
  - get
