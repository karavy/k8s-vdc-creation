# Local-development Terraform state storage: one MinIO with a "tfstate" bucket, and the
# dev-only credentials that the operator (to read states) and the Terraform Jobs (to write
# them) use. Never use these credentials or this emptyDir storage outside a throwaway cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: tfstate-storage
  labels:
    app.kubernetes.io/name: tfstate-storage
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: tfstate-storage
type: Opaque
stringData:
  MINIO_ROOT_USER: tfstate-dev
  MINIO_ROOT_PASSWORD: tfstate-dev-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: tfstate-storage
  labels:
    app.kubernetes.io/name: tfstate-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tfstate-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tfstate-storage
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          imagePullPolicy: IfNotPresent
          # A directory under /data is a bucket: create it before the server starts.
          command: ["sh", "-c", "mkdir -p /data/tfstate && exec minio server /data --console-address :9001"]
          envFrom:
            - secretRef:
                name: minio-root
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tfstate-storage
spec:
  selector:
    app.kubernetes.io/name: tfstate-storage
  ports:
    - {name: s3, port: 9000, targetPort: s3}
    - {name: console, port: 9001, targetPort: console}
---
# The operator reads states with these (see the patch in kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: tfstate-operator-credentials
  namespace: k8s-vdc-creation-system
type: Opaque
stringData:
  TFSTATE_S3_ACCESS_KEY_ID: tfstate-dev
  TFSTATE_S3_SECRET_ACCESS_KEY: tfstate-dev-secret
---
# Terraform Jobs of workflows in the "default" namespace write states with these
# (a step lists the Secret in terraform.envFromSecrets).
apiVersion: v1
kind: Secret
metadata:
  name: tfstate-credentials
  namespace: default
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: tfstate-dev
  AWS_SECRET_ACCESS_KEY: tfstate-dev-secret
