                        properties:
                          apiCallName:
                            type: string
                          attempts:
                            format: int32
                            type: integer
                          jobName:
                            type: string
                          message:
                            type: string
                          name:
                            type: string
                          nextAttemptAt:
                            description: NextAttemptAt is when a retry of the step's
                              request is due.
                            format: date-time
                            type: string
                          outputs:
                            additionalProperties:
                              type: string
                            description: Outputs holds the step's non-sensitive output
                              values, JSON-encoded, by name.
                            maxProperties: 32
                            type: object
                          phase:
                            enum:
                            - Pending
                            - Running
                            - Polling
                            - Succeeded
                            - Failed
                            - Unknown
                            - Skipped
                            type: string
                          sensitiveOutputs:
                            description: |-
                              SensitiveOutputs lists the output names whose values live in the workflow's
                              outputs Secret, under the key "<step>.<output>". Values are never shown here.
                            items:
                              type: string
                            maxItems: 32
                            type: array
                            x-kubernetes-list-type: set
                          stateKey:
                            description: StateKey is the object key of the step's
                              Terraform state in the state storage.
                            type: string
                        required:
                        - name
                        - phase
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    templateGeneration:
                      description: |-
                        TemplateGeneration is the generation of the WorkflowTemplate when it started. If the
                        template is edited while it runs, the Workflow fails instead of mixing two versions.
                      format: int64
                      type: integer
                    workspacePVCName:
                      description: PVC for the Terraform files of this template.
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
