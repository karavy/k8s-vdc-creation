---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workflows.kmetal.dinova.one
spec:
  group: kmetal.dinova.one
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentTemplate
      name: Template
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workflow is the Schema for the workflows API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Workflow
            properties:
              templates:
                description: |-
                  Templates run strictly in order. A template starts only after the one before it has
                  completed, and the first one that fails stops the Workflow. When the Workflow is deleted,
                  the deleteSteps of the templates that ran are executed in the opposite order.
                items:
                  description: WorkflowTemplateRun is one use of a WorkflowTemplate
                    by a Workflow.
                  properties:
                    name:
                      description: |-
                        Name identifies this use inside the Workflow, and prefixes the names of the objects it
                        creates. The same template can be used twice under two names.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    parameters:
                      description: |-
                        Parameters give a value to the parameters the template declares. A parameter that
                        the template does not declare is refused, and so is a missing one that has no default.
                      items:
                        description: WorkflowParameter is a named string value.
                        properties:
                          name:
                            maxLength: 63
                            pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                            type: string
                          value:
                            maxLength: 1024
                            type: string
                        required:
                        - name
                        - value
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    templateRef:
                      description: TemplateRef names the WorkflowTemplate to run,
                        in the Workflow's namespace.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - name
                  - templateRef
                  type: object
                maxItems: 20
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workspaceStorage:
                default: 2Gi
                description: |-
                  WorkspaceStorage requests, for each template that has a Terraform step, a PVC for the
                  Terraform working files (rendered templates, providers). Terraform state does not live
                  here: see WorkflowTerraformState.
                pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
                type: string
            required:
            - templates
            type: object
            x-kubernetes-validations:
            - message: Workflow spec is immutable; create a new workflow to change
                what it runs
              rule: self == oldSelf
          status:
            description: status defines the observed state of Workflow
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentTemplate:
                description: Index of the template that runs next; zero-based.
                format: int32
                type: integer
              deletion:
                description: Deletion is set once the Workflow is being deleted and
                  a template that ran has deleteSteps.
                properties:
                  currentTemplate:
                    description: |-
                      Index of the template being cleaned up; zero-based. It goes down, from the last
                      template that ran to the first.
                    format: int32
                    type: integer
                  phase:
                    enum:
                    - Running
                    - Succeeded
                    - Failed
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Unknown
                type: string
              templates:
                items:
                  description: |-
                    WorkflowTemplateStatus records the progress of one template of the Workflow. Besides the
                    declared non-sensitive outputs, no API response data is copied into the status.
                  properties:
                    currentStep:
                      description: Index of the next step of the template; zero-based.
                      format: int32
                      type: integer
                    deletion:
                      description: Deletion records the template's deleteSteps once
                        the Workflow is being deleted.
                      properties:
                        currentStep:
                          description: Index of the next delete step; zero-based.
                          format: int32
                          type: integer
                        phase:
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        steps:
                          items:
                            description: |-
                              WorkflowStepStatus records execution progress. Besides the declared non-sensitive
                              outputs, no API response data is copied into the Workflow status.
                            properties:
                              apiCallName:
                                type: string
                              attempts:
                                format: int32
                                type: integer
                              jobName:
                                type: string
                              message:
                                type: string
                              name:
                                type: string
                              nextAttemptAt:
                                description: NextAttemptAt is when a retry of the
                                  step's request is due.
                                format: date-time
                                type: string
                              outputs:
                                additionalProperties:
                                  type: string
                                description: Outputs holds the step's non-sensitive
                                  output values, JSON-encoded, by name.
                                maxProperties: 32
                                type: object
                              phase:
                                enum:
                                - Pending
                                - Running
                                - Polling
                                - Succeeded
                                - Failed
                                - Unknown
                                - Skipped
                                type: string
                              sensitiveOutputs:
                                description: |-
                                  SensitiveOutputs lists the output names whose values live in the workflow's
                                  outputs Secret, under the key "<step>.<output>". Values are never shown here.
                                items:
                                  type: string
                                maxItems: 32
                                type: array
                                x-kubernetes-list-type: set
                              stateKey:
                                description: StateKey is the object key of the step's
                                  Terraform state in the state storage.
                                type: string
                            required:
                            - name
                            - phase
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                      type: object
                    name:
                      description: Name is the name of the template use, from spec.templates.
                      type: string
                    outputsSecretName:
                      description: Name of the Secret holding this template's sensitive
                        outputs, if any.
                      type: string
                    phase:
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Unknown
                      type: string
                    steps:
                      items:
                        description: |-
                          WorkflowStepStatus records execution progress. Besides the declared non-sensitive
