# The portal origin must be allowed on the manager:
#   --apicall-allowed-origins=https://dev-portal.admin.dinova.cloud:8453
#
# The API key is read from a Secret in this namespace; it is not part of these files:
#   kubectl create secret generic portal-api-key --from-literal=api-key="$PORTAL_API_KEY"
# The key needs the role that allows reading the iTop blocks.
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-list-blocks
spec:
  method: GET
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/p2p/itop/blocks
  timeoutSeconds: 120
  headers:
    Accept: application/json
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-block-subnets
spec:
  method: GET
  # block_id is added by the workflow (input toQuery) from the block found by list-blocks.
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/p2p/itop/block-subnets?mask=31
  timeoutSeconds: 120
  headers:
    Accept: application/json
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-segment-name-check
spec:
  method: GET
  # client_name and env_name (Workflow parameters) are added by the
  # workflow, with input toQuery.
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/p2p/segments/name-check
  timeoutSeconds: 120
  headers:
    Accept: application/json
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
apiVersion: kmetal.dinova.one/v1alpha1
kind: ApiCallTemplate
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/component: p2p-workflow
  name: p2p-segment-create
spec:
  method: POST
  endpoint: https://dev-portal.admin.dinova.cloud:8453/api/v1/p2p/segments/create
  # Debug on the template and on the step that uses it: the operator only logs the request.
  # Responses: 409 when the T1 or
  # the segment already exist, 502 when NSX-T cannot be reached or the creation fails. After
  # a 502 the T1 can be left on NSX-T: there is no rollback.
  debug: true
  timeoutSeconds: 120
  headers:
    Content-Type: application/json
    Accept: application/json
  # The workflow fills every field but itop_subnet_id, which stays null.
  body: '{"env_name":"","client_name":"","subnet_ip":"","subnet_mask":"","itop_subnet_id":null,"itop_block_id":""}'
  authentication:
    type: APIKey
    headerName: X-API-Key
    tokenSecretRef:
      name: portal-api-key
      key: api-key
---
