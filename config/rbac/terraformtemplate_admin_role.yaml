# This rule is not used by the project k8s-vdc-creation itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kmetal.dinova.one.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-vdc-creation
    app.kubernetes.io/managed-by: kustomize
  name: terraformtemplate-admin-role
rules:
- apiGroups:
  - kmetal.dinova.one
  resources:
  - terraformtemplates
  verbs:
  - '*'
- apiGroups:
  - kmetal.dinova.one
  resources:
  - terraformtemplates/status
  verbs:
  - get
